services:
  db:
    image: postgres:15-alpine
    container_name: synapse-vault-db
    environment:
      POSTGRES_DB: synapsevault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # DRAFT (EQ-LLM-01): local LLM, internal network only, no host port publish.
  llm-engine:
    image: ollama/ollama:latest
    container_name: karen-llm-engine
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=127.0.0.1:11434
      - OLLAMA_GO_TEMPLATE=false
      - MODEL_NAME=${LLM_MODEL:-qwen3:4b}
    entrypoint: ["/bin/bash", "/scripts/entrypoint.sh"]
    volumes:
      - ollama_models:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/scripts/entrypoint.sh:ro
    # Host networking with loopback bind: no NAT/DNAT required, and the API
    # (systemd on the host) reaches 127.0.0.1:11434. Not publicly exposed.
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  api:
    build: ./api
    container_name: synapse-vault-api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/synapsevault
      - LLM_API_KEY=${LLM_API_KEY:-local}
      # Draft: default to the internal llm-engine service. To keep using the
      # host llama.cpp, set LLM_BASE_URL=http://host.docker.internal:8080/v1
      # in the env file. No production change until EQ-LLM-01 is approved.
      - LLM_BASE_URL=${LLM_BASE_URL:-http://llm-engine:11434/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen3:4b}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-@cf/baai/bge-m3}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - karen_internal

  ui:
    build: ./ui
    container_name: synapse-vault-ui
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  ollama_models:

networks:
  karen_internal:
    driver: bridge
