services:
  db:
    image: postgres:15-alpine
    container_name: synapse-vault-db
    environment:
      POSTGRES_DB: synapsevault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: synapse-vault-api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/synapsevault
      - LLM_API_KEY=${LLM_API_KEY:-local}
      # For Docker, llama.cpp must listen on 0.0.0.0 (not 127.0.0.1).
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      - LLM_MODEL=${LLM_MODEL:-jarvis}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-@cf/baai/bge-m3}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1024}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./ui
    container_name: synapse-vault-ui
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
