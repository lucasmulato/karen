<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070d">
<meta name="description" content="KAREN — lucas mulato agentic assistant">
<title>KAREN</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:#e2e8f0;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:
      radial-gradient(ellipse 70% 50% at 50% -10%, rgba(34,211,238,.09), transparent 70%),
      #05070d;
    display:grid; place-items:center; padding:24px;
  }
  .frame {
    position:relative; width:100%; max-width:640px; padding:64px 32px 48px;
    text-align:center;
    background:linear-gradient(145deg, rgba(11,16,24,.92), rgba(5,7,13,.9));
    border:1px solid rgba(34,211,238,.16);
  }
  .frame::before,.frame::after{
    content:''; position:absolute; width:18px; height:18px;
  }
  .frame::before{top:-1px;left:-1px;border-top:1px solid #22d3ee;border-left:1px solid #22d3ee;}
  .frame::after{bottom:-1px;right:-1px;border-bottom:1px solid #22d3ee;border-right:1px solid #22d3ee;}
  .eyebrow{font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.24em;color:#22d3ee;text-transform:uppercase;margin:0 0 28px;}
  h1{margin:0;font-size:clamp(52px,10vw,92px);letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#f8fafc;}
  .rule{width:56px;height:1px;background:linear-gradient(90deg,transparent,#22d3ee,transparent);margin:24px auto;}
  .subtitle{margin:0;color:#94a3b8;font-size:clamp(13px,2.2vw,18px);letter-spacing:.03em;}
  a.btn{
    display:inline-flex;align-items:center;gap:12px;margin-top:44px;
    padding:13px 30px;border:1px solid rgba(34,211,238,.55);
    color:#22d3ee;text-decoration:none;font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.16em;text-transform:uppercase;transition:background .15s,box-shadow .15s;
  }
  a.btn:hover{background:rgba(34,211,238,.1);box-shadow:0 0 24px rgba(34,211,238,.14);}
  footer{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#334155;font:10px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;}
</style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Agentic system // 01</p>
    <h1>KAREN</h1>
    <div class="rule"></div>
    <p class="subtitle">lucas mulato agentic assistant</p>
    <a class="btn" href="/login.html">Entrar →</a>
  </main>
  <footer>private instance · session-based access</footer>
</body>
</html>
