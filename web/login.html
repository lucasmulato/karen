<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070d">
<title>Entrar — KAREN</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:#e2e8f0;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:radial-gradient(ellipse 70% 50% at 50% -10%, rgba(34,211,238,.08), transparent 70%), #05070d;
    display:grid; place-items:center; padding:24px;
  }
  form {
    position:relative; width:100%; max-width:400px; padding:40px 32px 32px;
    background:linear-gradient(145deg, rgba(11,16,24,.95), rgba(5,7,13,.92));
    border:1px solid rgba(34,211,238,.16);
  }
  form::before,form::after{content:'';position:absolute;width:14px;height:14px;}
  form::before{top:-1px;left:-1px;border-top:1px solid #22d3ee;border-left:1px solid #22d3ee;}
  form::after{bottom:-1px;right:-1px;border-bottom:1px solid #22d3ee;border-right:1px solid #22d3ee;}
  .eyebrow{font:10px/1 ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;color:#22d3ee;margin:0 0 10px;}
  h1{margin:0;font-size:26px;letter-spacing:.16em;text-transform:uppercase;}
  p{color:#64748b;font-size:12px;margin:8px 0 26px;}
  label{display:block;font:10px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#64748b;margin:16px 0 7px;}
  input{
    width:100%;padding:12px 13px;border:1px solid #163044;background:#05070d;color:#e2e8f0;
    font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;outline:none;
  }
  input:focus{border-color:#22d3ee;box-shadow:0 0 0 2px rgba(34,211,238,.12);}
  button{
    width:100%;margin-top:24px;padding:12px;border:1px solid rgba(34,211,238,.55);
    background:transparent;color:#22d3ee;cursor:pointer;
    font:11px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;
  }
  button:hover{background:rgba(34,211,238,.1);}
  button:disabled{opacity:.5;cursor:wait;}
  #mfa{margin-top:22px;border-top:1px solid #163044;padding-top:8px;}
  .error{margin-top:14px;color:#fb7185;font:11px/1.4 ui-monospace,monospace;min-height:16px;}
  .back{display:block;text-align:center;margin-top:22px;color:#64748b;font:10px/1 ui-monospace,monospace;letter-spacing:.14em;text-decoration:none;text-transform:uppercase;}
  .back:hover{color:#22d3ee;}
</style>
</head>
<body>
  <form id="login">
    <p class="eyebrow">Secure access // KAREN</p>
    <h1>KAREN</h1>
    <p>Entre no seu assistente</p>
    <label for="username">Usuário</label>
    <input id="username" name="username" value="karen" autocomplete="username" required>
    <label for="password">Senha</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Entrar</button>
    <div id="mfa" style="display:none">
      <label for="code">Código do autenticador</label>
      <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code">
      <button type="button" id="mfa-button">Confirmar código</button>
    </div>
    <div class="error" id="error"></div>
    <a class="back" href="/">← Voltar</a>
  </form>
  <script>
    let pendingToken = null;
    const errorBox = document.getElementById('error');

    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = e.target.querySelector('button[type="submit"]');
      errorBox.textContent = '';
      button.disabled = true;
      button.textContent = 'Entrando...';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Falha no login');
        if (data.mfaRequired) {
          pendingToken = data.pendingToken;
          document.getElementById('mfa').style.display = 'block';
          document.getElementById('code').focus();
          button.disabled = false;
          button.textContent = 'Entrar';
          return;
        }
        window.location.href = '/app/';
      } catch (err) {
        errorBox.textContent = err.message;
        button.disabled = false;
        button.textContent = 'Entrar';
      }
    });

    document.getElementById('mfa-button').addEventListener('click', async () => {
      errorBox.textContent = '';
      const button = document.getElementById('mfa-button');
      button.disabled = true;
      try {
        const res = await fetch('/api/auth/mfa/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            pendingToken,
            code: document.getElementById('code').value.trim(),
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Código inválido');
        window.location.href = '/app/';
      } catch (err) {
        errorBox.textContent = err.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
